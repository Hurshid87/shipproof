# Example: fail the job when the deploy did not actually land.
# Copy into your own repo and replace the deploy step.
name: deploy and prove it

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - run: pip install shipproof

      - name: fingerprint the live site BEFORE deploying
        run: shipproof snapshot ${{ vars.APP_URL }} --marker-json version

      - name: deploy
        run: ./deploy.sh

      - name: prove the new build is really serving
        run: shipproof verify ${{ vars.APP_URL }} --timeout 900 --settle 60 --json
