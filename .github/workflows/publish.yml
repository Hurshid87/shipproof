# Публикация на PyPI без токена — Trusted Publishing (OIDC).
#
# PyPI сам проверяет, что сборка пришла ИМЕННО из этого репозитория и именно
# из этого файла workflow, и выдаёт одноразовый пропуск на одну загрузку.
# Токена не существует: нечего скопировать, нечего потерять, нечего украсть.
# Это ровно та же логика, что и во всём проекте — доказательство вместо
# обещания.
#
# Что нужно один раз сделать на pypi.org (меню слева → Publishing):
#   PyPI Project Name: shipproof
#   Owner:             Hurshid87
#   Repository name:   shipproof
#   Workflow name:     publish.yml
#   Environment name:  оставить пустым
#
# Дальше: Releases → Create a new release → тег v0.1.0 → Publish release.
name: publish

on:
  release:
    types: [published]
  workflow_dispatch:        # кнопка «Run workflow» для ручного запуска

permissions:
  contents: read
  id-token: write           # без этого PyPI не сможет проверить, кто пришёл

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Гейт ДО отправки: номер версии на PyPI нельзя перезалить, он сгорает
      # навсегда. Инструмент, который врёт про деплой, выкладывать нельзя.
      # pytest на чистом раннере не стоит — его надо поставить явно.
      # Первый прогон упал именно здесь: гейт сработал ДО отправки на PyPI,
      # то есть сделал ровно то, ради чего стоит. Номер версии не сгорел.
      - name: Тесты
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests -q

      - name: Сборка пакета
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Загрузка на PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
